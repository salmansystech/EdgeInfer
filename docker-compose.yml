services:
  backend:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env

  frontend:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      # The UI calls /api on its own origin; Vite proxies it to the backend container
      - API_PROXY_TARGET=http://backend:5000
    depends_on:
      - backend
